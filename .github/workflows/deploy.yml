name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 213.190.4.182
          username: root
          key: ${{ secrets.SPT_MERCHANT_WEB_DEPLOY_KEY }}
          # the key is pinned server-side to /opt/node_spt_merchant_web/deploy.sh (docker build + up)
          script: deploy
          command_timeout: 30m

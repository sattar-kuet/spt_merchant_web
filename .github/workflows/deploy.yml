name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 38.242.158.202
          username: root
          key: ${{ secrets.MERCHANT_WEB_DEPLOY_KEY }}
          script: bash /opt/node_spt_merchant_web/deploy.sh
